<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library help desk (jichi example)</title>
<style>
  :root { color-scheme: light dark; --gap: 0.75rem; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  #log { display: flex; flex-direction: column; gap: var(--gap); margin-bottom: var(--gap); }
  .msg { padding: 0.6rem 0.8rem; border-radius: 0.6rem; white-space: pre-wrap; }
  .you { align-self: flex-end; background: #2a6df422; }
  .bot { align-self: flex-start; background: #8881; }
  .err { align-self: flex-start; background: #d3302f22; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; font: inherit; padding: 0.5rem; }
  button { font: inherit; padding: 0.5rem 1rem; }
  small { opacity: 0.7; }
</style>
</head>
<body>
<h1>Library help desk</h1>
<p><small>An example of jichi as a chatbot component: it answers from the documents in its
knowledge folder, and can read but never change them.</small></p>
<div id="log" aria-live="polite"></div>
<form id="ask">
  <input id="q" name="q" autocomplete="off" maxlength="2000" required
         placeholder="Ask about opening hours or borrowing" aria-label="Your question">
  <button id="send">Send</button>
</form>
<script>
  "use strict";
  let conversation = null;
  const log = document.getElementById("log");
  function add(kind, text) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;            /* text, never HTML: a reply cannot inject markup */
    log.appendChild(div);
    div.scrollIntoView({ block: "end" });
  }
  document.getElementById("ask").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const q = document.getElementById("q");
    const send = document.getElementById("send");
    const message = q.value.trim();
    if (!message) return;
    add("you", message);
    q.value = "";
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation, message })
      });
      const data = await res.json();
      if (data.conversation) conversation = data.conversation;
      add(res.ok ? "bot" : "err", res.ok ? data.reply : data.error);
    } catch (e) {
      add("err", "The server could not be reached.");
    } finally {
      send.disabled = false;
      q.focus();
    }
  });
</script>
</body>
</html>
