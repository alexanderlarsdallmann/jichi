<text class="t2" x="290.0" y="282.0" font-size="12" text-anchor="end" font-weight="400">network/VPN</text>
<path class="d0" d="M300.0,268.0 H311.7 Q315.7,268.0 315.7,272.0 V284.0 Q315.7,288.0 311.7,288.0 H300.0 Z" stroke-width="0"><title>network/VPN: 0.66 h in 3 set-backs</title></path>
<text class="t1" x="323.7" y="282.0" font-size="12" text-anchor="start" font-weight="400">0.7 h</text>
<text class="tm" x="820.0" y="322.0" font-size="11" text-anchor="end" font-weight="400">hours, each stretch counted once per cause</text>
</svg>
