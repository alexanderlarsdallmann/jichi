<text class="t2" x="290.0" y="122.0" font-size="12" text-anchor="end" font-weight="400">worker failure (cut off, stuck, no write access)</text>
<path class="d0" d="M300.0,108.0 H610.3 Q614.3,108.0 614.3,112.0 V124.0 Q614.3,128.0 610.3,128.0 H300.0 Z" stroke-width="0"><title>worker failure (cut off, stuck, no write access): 13.22 h in 8 set-backs</title></path>
