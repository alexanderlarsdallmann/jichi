<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 526" width="920" height="526" role="img">
<title>Which check caught each defect first, four drives</title><desc>confirmed defects, by the check that caught each first. The supervisor's log is the fullest record, so its catches are over-counted</desc>
<style>
.s{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.tm{fill:#898781}
