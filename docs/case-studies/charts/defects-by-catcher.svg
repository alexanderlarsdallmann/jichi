.d3{fill:#c98500;stroke:#c98500}.ring{stroke:#1a1a19}
.l0{stroke:#3987e5}.l1{stroke:#d95926}.l2{stroke:#199e70}.l3{stroke:#c98500}.ink{fill:#c3c2b7}}
</style>
